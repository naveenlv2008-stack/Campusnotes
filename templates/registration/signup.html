{% extends "base.html" %}
{% block title %}Sign Up - CampusNotes{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="auth-card">
        <h2 class="fw-bold">Create account 🚀</h2>
        <p class="text-secondary">Start sharing and discovering notes.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100 btn-lg">Create Account</button>
        </form>
        <p class="text-center mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
