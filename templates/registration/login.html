{% extends "base.html" %}
{% block title %}Login - CampusNotes{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="auth-card">
        <h2 class="fw-bold">Welcome back 👋</h2>
        <p class="text-secondary">Login to access your notes.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <button class="btn btn-primary w-100 btn-lg">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">New here? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
